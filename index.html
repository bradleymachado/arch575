<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>West Loop Gateway — Brad Machado</title>
<meta name="description" content="West Loop Gateway · Mixed-use tower, 725 W. Randolph St. · ARCH 575 mid-review, Fall 2026">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://arch575.bradmachado.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/intro.css">
<link rel="stylesheet" href="/css/siteloop.css">
<link rel="preload" href="data/levels.json" as="fetch" crossorigin="anonymous">
</head>
<body>

<header class="deck-header">
  <a href="https://bradmachado.com/" class="eyebrow deck-header__eyebrow">ARCH 575 / West Loop Gateway</a>
  <span class="deck-header__count" id="deck-count" aria-live="polite">01 / 12</span>
</header>

<main class="deck" id="deck" data-kind="title">
  <!-- Slides 01 (title) and 02 (site) are inserted here by js/app.js; on 02 the canvas below runs the site loop (js/siteloop.js) -->
  <div class="deck__tower" id="tower-wrap" aria-hidden="true">
    <canvas id="tower"></canvas>
  </div>
  <!-- Slides 03–12 (levels) are inserted here by js/app.js -->
</main>

<nav class="deck-nav" aria-label="Slides">
  <button class="deck-nav__btn" type="button" id="deck-prev" aria-label="Previous slide">&larr;</button>
  <button class="deck-nav__btn" type="button" id="deck-next" aria-label="Next slide">&rarr;</button>
</nav>

<template id="tpl-title">
  <section class="slide slide--title">
    <div class="slide__text">
      <span class="eyebrow" data-f="eyebrow"></span>
      <div class="title__block">
        <h1 class="title__h1" data-f="h1"></h1>
        <div class="title__lines" data-f="lines"></div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-site">
  <section class="slide slide--site">
    <figure class="site slide__site">
      <img class="site__img" src="assets/site.jpg" alt="" data-f="img">
      <figcaption data-f="caption"></figcaption>
    </figure>
    <div class="slide__text">
      <span class="eyebrow" data-f="label"></span>
      <p class="level__name" data-f="name"></p>
      <p class="level__sub" data-f="sub"></p>
      <div class="site__lines" data-f="lines"></div>
      <figure class="site__layout" data-f="layout" hidden>
        <img class="site__layout-img" src="" alt="" data-f="layoutImg">
        <figcaption data-f="layoutCap"></figcaption>
      </figure>
    </div>
  </section>
</template>

<template id="tpl-text">
  <section class="slide slide--text">
    <div class="slide__text">
      <span class="eyebrow" data-f="eyebrow"></span>
      <h2 class="text__h2" data-f="heading"></h2>
      <div class="text__lines" data-f="lines"></div>
      <table class="data text__data"><tbody data-f="rows"></tbody></table>
    </div>
    <div class="model__grid" data-f="grid" hidden></div>
    <figure class="text__aside" data-f="aside" hidden>
      <img class="text__aside-img" src="" alt="" data-f="asideImg">
      <figcaption data-f="asideCap"></figcaption>
    </figure>
    <div class="callouts" data-f="callouts" aria-hidden="true"></div>
  </section>
</template>

<template id="tpl-pair">
  <section class="slide slide--pair">
    <span class="eyebrow pair__eyebrow" data-f="label"></span>
    <div class="pair">
      <figure class="pair__item">
        <img class="pair__img" src="" alt="" data-f="img1">
        <p class="pair__title" data-f="name1"></p>
        <figcaption data-f="caption1"></figcaption>
      </figure>
      <figure class="pair__item">
        <img class="pair__img" src="" alt="" data-f="img2">
        <p class="pair__title" data-f="name2"></p>
        <figcaption data-f="caption2"></figcaption>
      </figure>
    </div>
  </section>
</template>

<template id="tpl-level">
  <section class="slide slide--level">
    <div class="slide__text">
      <h2 class="level__label" data-f="label"></h2>
      <p class="level__name" data-f="name"></p>
      <p class="level__sub" data-f="sub"></p>
      <p class="level__desc" data-f="description"></p>
      <table class="data"><tbody data-f="rows"></tbody></table>
      <ul class="key" data-f="key"></ul>
    </div>
    <figure class="plan slide__plan">
      <img class="plan__img" alt="" data-f="plan">
      <svg class="plan__scale" height="24" aria-hidden="true" data-f="scale"></svg>
      <figcaption data-f="caption"></figcaption>
    </figure>
  </section>
</template>

<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.js", "three/addons/": "./js/vendor/addons/" } }
</script>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/tower.js"></script>
<script type="module" src="/js/intro.js"></script>
<script type="module" src="/js/siteloop.js"></script>
</body>
</html>
